name: Build Elory Dashboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dashboard-android/Elory_Dashboard_Build_Ready.zip'
      - '.github/workflows/build-elory-dashboard.yml'
      - 'dashboard-android/dashboard-android/scripts/**'
  pull_request:
    paths:
      - 'dashboard-android/Elory_Dashboard_Build_Ready.zip'
      - '.github/workflows/build-elory-dashboard.yml'
      - 'dashboard-android/dashboard-android/scripts/**'

permissions:
  contents: read

concurrency:
  group: elory-dashboard-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project archive
        id: extract
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/dashboard-android/Elory_Dashboard_Build_Ready.zip"
          SOURCE_DIR="$RUNNER_TEMP/elory-source"

          if [[ ! -s "$ARCHIVE" ]]; then
            echo "Required project archive not found: $ARCHIVE"
            echo "Repository contents:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$SOURCE_DIR"
          unzip -q "$ARCHIVE" -d "$SOURCE_DIR"

          SETTINGS_FILE="$(find "$SOURCE_DIR" -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo 'settings.gradle.kts was not found inside the project ZIP.'
            echo 'Archive contents:'
            unzip -l "$ARCHIVE" | head -80
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "Found settings.gradle.kts but app/build.gradle.kts is missing in $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project extracted to: $PROJECT_DIR"
          echo 'Project files:'
          ls -lah "$PROJECT_DIR"

      - name: Export source archive for source-level diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: Elory-Dashboard-Source-Archive
          path: dashboard-android/Elory_Dashboard_Build_Ready.zip
          if-no-files-found: error
          retention-days: 1

      - name: Apply Elory CMS updates
        # CMS patch includes hero visibility, custom-section image uploads, and safe section ordering.
        # Adds the live phone preview component missing from the source archive.
        # Synchronizes custom-section visibility between the section list and custom content object.
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dashboard-android/scripts/apply-elory-cms-patch.py

      - name: Apply shipping, Prime, and staff management fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dashboard-android/scripts/apply-elory-operations-fixes.py

      - name: Integrate Elory customer metrics, FCM notifications and branded launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dashboard-android/scripts/apply-elory-order-push-icon.py

      - name: Integrate Elory customer order codes and refreshed launcher icon
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dashboard-android/scripts/apply-elory-customer-order-code.py

      - name: Apply Elory hero banners, coupon controls, and store availability
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dashboard-android/scripts/apply-elory-promo-center.py

      - name: Verify order item image and pricing fields
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dashboard-android/scripts/verify-order-item-display.py

      - name: Apply dynamic Elory Prime settings controls
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dashboard-android/scripts/apply-elory-prime-controls.py

      - name: Build the Elory profit analytics dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dashboard-android/scripts/apply-elory-profit-dashboard.py
          python3 dashboard-android/scripts/apply-elory-cms-draft-preview-publish.py

      - name: Diagnose source sync method before repair
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_FILE="$PROJECT_DIR/app/src/main/java/com/pinky/dashboard/ui/PinkyViewModel.kt"
          echo '--- syncRemainingSupabaseData method source ---'
          grep -n -A400 -B5 '^    private fun syncRemainingSupabaseData' "$SOURCE_FILE" || true

      - name: Repair awaited Supabase sync and category image uploads
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dashboard-android/scripts/apply-elory-supabase-sync-repair.py

      - name: Align Supabase DTOs with the live Elory schema
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dashboard-android/scripts/apply-elory-schema-contract-fixes.py

      - name: Repair product UUID creation and Supabase read-after-write
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dashboard-android/scripts/apply-elory-product-uuid-repair.py

      - name: Connect existing product weight field to Supabase and local cache
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-product-weight-repair.py
          python3 dashboard-android/scripts/apply-elory-product-weight-repair.py

      - name: Verify product weight is wired through editor, Supabase, and Room
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["PROJECT_DIR"])
          checks = {
              "domain model": ("app/src/main/java/com/pinky/dashboard/domain/model/Product.kt", "val weight: Double? = null"),
              "Room entity": ("app/src/main/java/com/pinky/dashboard/data/local/entity/Entities.kt", "val weight: Double? = null"),
              "Room migration": ("app/src/main/java/com/pinky/dashboard/data/local/PinkyDatabase.kt", 'ALTER TABLE products ADD COLUMN weight REAL'),
              "Room migration registration": ("app/src/main/java/com/pinky/dashboard/data/local/PinkyDatabase.kt", "MIGRATION_8_9)"),
              "editor restoration": ("app/src/main/java/com/pinky/dashboard/ui/screens/products/ProductEditDialog.kt", "initialProduct?.weight?.toString()"),
              "editor validation": ("app/src/main/java/com/pinky/dashboard/ui/screens/products/ProductEditDialog.kt", "normalizedWeight"),
              "editor save": ("app/src/main/java/com/pinky/dashboard/ui/screens/products/ProductEditDialog.kt", "weight = weight"),
              "Supabase upsert": ("app/src/main/java/com/pinky/dashboard/data/repository/RepositoriesImpl.kt", "weight = product.weight"),
              "Supabase sync": ("app/src/main/java/com/pinky/dashboard/data/repository/RepositoriesImpl.kt", "weight = dto.weight"),
              "Room restore": ("app/src/main/java/com/pinky/dashboard/data/repository/RepositoriesImpl.kt", "weight = weight"),
          }
          for label, (relative, marker) in checks.items():
              if marker not in (root / relative).read_text(encoding="utf-8"):
                  raise SystemExit("Product-weight regression: missing " + label)
              print("PASS:", label)
          PY

      - name: Repair offer and banner UUID creation, updates, and deletes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dashboard-android/scripts/apply-elory-offer-uuid-repair.py

      - name: Apply owner-only PIN protected cleanup for orders, customers and coupons
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-owner-data-reset.py
          python3 dashboard-android/scripts/apply-elory-owner-data-reset.py

      - name: Organize website editor and enable free color wheel
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-website-editor-tabs-colors.py
          python3 dashboard-android/scripts/apply-elory-website-editor-tabs-colors.py

      - name: Persist dashboard payment settings without overwriting other CMS fields
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-payment-method-persistence.py
          python3 dashboard-android/scripts/apply-elory-payment-method-persistence.py

      - name: Repair product palette, product saving, order sync and owner staff tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path("dashboard-android/scripts/elory-dashboard-workflow-fixes.patch.gz.b64").read_text(encoding="ascii").strip()
          patch_data = gzip.decompress(base64.b64decode(encoded, validate=True))
          Path("/tmp/elory-dashboard-workflow-fixes.patch").write_bytes(patch_data)
          print("Decoded source repair patch:", len(patch_data), "bytes")
          PY
          patch --batch --forward -p1 -d "$PROJECT_DIR" < /tmp/elory-dashboard-workflow-fixes.patch
          # KeyboardOptions is part of Compose Foundation, not ui.text.input.
          sed -i 's/import androidx.compose.ui.text.input.KeyboardOptions/import androidx.compose.foundation.text.KeyboardOptions/' "$PROJECT_DIR/app/src/main/java/com/pinky/dashboard/ui/screens/staff/StaffScreen.kt"
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path("dashboard-android/scripts/elory-dashboard-fcm-order-refresh.patch.gz.b64").read_text(encoding="ascii").strip()
          Path("/tmp/elory-dashboard-fcm-order-refresh.patch").write_bytes(gzip.decompress(base64.b64decode(encoded, validate=True)))
          PY
          patch --batch --forward -p1 -d "$PROJECT_DIR" < /tmp/elory-dashboard-fcm-order-refresh.patch
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["PROJECT_DIR"])
          checks = {
              "color palette model": ("app/src/main/java/com/pinky/dashboard/domain/model/Product.kt", "data class ProductColorOption"),
              "color swatch editor": ("app/src/main/java/com/pinky/dashboard/ui/screens/products/ProductEditDialog.kt", "ألوان المنتج — اختَر اللون من الباليتة"),
              "Supabase color options": ("app/src/main/java/com/pinky/dashboard/data/remote/SupabaseClient.kt", "color_options"),
              "variant persistence": ("app/src/main/java/com/pinky/dashboard/data/repository/RepositoriesImpl.kt", "variantsJson = encodeProductVariants"),
              "awaited product save": ("app/src/main/java/com/pinky/dashboard/ui/screens/products/ProductEditDialog.kt", "val saveResult = onSave(updated)"),
              "owner product delete UI": ("app/src/main/java/com/pinky/dashboard/ui/screens/products/ProductsScreen.kt", "scopeLabel = \"المنتجات\""),
              "paged orders": ("app/src/main/java/com/pinky/dashboard/data/remote/SupabaseClient.kt", "getOrdersPage("),
              "authoritative order cache": ("app/src/main/java/com/pinky/dashboard/data/repository/RepositoriesImpl.kt", "orderDao.replaceOrders(orderEntities, itemEntities)"),
              "three order stages": ("app/src/main/java/com/pinky/dashboard/domain/model/Order.kt", "val fulfillmentStatuses"),
              "owner password reset UI": ("app/src/main/java/com/pinky/dashboard/ui/screens/staff/StaffScreen.kt", "إعادة تعيين كلمة المرور"),
              "Compose password keyboard import": ("app/src/main/java/com/pinky/dashboard/ui/screens/staff/StaffScreen.kt", "import androidx.compose.foundation.text.KeyboardOptions"),
              "password reset endpoint": ("app/src/main/java/com/pinky/dashboard/data/remote/SupabaseClient.kt", "admin-reset-staff-password"),
              "FCM immediate order refresh": ("app/src/main/java/com/pinky/dashboard/core/notification/EloryFirebaseMessagingService.kt", "OrderRepositoryImpl(database).syncOrders()"),
              "non-destructive Room options migration": ("app/src/main/java/com/pinky/dashboard/data/local/PinkyDatabase.kt", "MIGRATION_9_10")
          }
          for label, (relative, marker) in checks.items():
              if marker not in (root / relative).read_text(encoding="utf-8"):
                  raise SystemExit("Elory regression check failed: " + label)
              print("PASS:", label)
          PY

      - name: Apply payment-aware COD and Paymob order statuses
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-order-payment-status-flow.py
          python3 dashboard-android/scripts/apply-elory-order-payment-status-flow.py

      - name: Label online and cash payments and expose failed Paymob status
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-payment-display-and-failure.py
          python3 dashboard-android/scripts/apply-elory-payment-display-and-failure.py

      - name: Add distinct shipping and shipped order stages
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-order-shipping-stages.py
          python3 dashboard-android/scripts/apply-elory-order-shipping-stages.py

      - name: Show selected product colors in order details
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-order-detail-color-swatch.py dashboard-android/scripts/verify-order-detail-color-swatch.py
          python3 dashboard-android/scripts/apply-order-detail-color-swatch.py
          python3 dashboard-android/scripts/verify-order-detail-color-swatch.py

      - name: Add owner-PIN protected Prime subscriber deletion
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-prime-subscriber-delete.py
          python3 dashboard-android/scripts/apply-elory-prime-subscriber-delete.py

      - name: Apply Elory website save, unrestricted product color wheel, and staff-only PIN UI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-followup-fixes.py
          python3 dashboard-android/scripts/apply-elory-followup-fixes.py

      - name: Fix Compose compatibility in Elory follow-up UI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/fix-elory-followup-compile.py
          python3 dashboard-android/scripts/fix-elory-followup-compile.py

      - name: Add dashboard copy, notification filters, per-section diagnostics, and shipping overview
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-dashboard-quality.py
          PROJECT_DIR="$PROJECT_DIR" python3 dashboard-android/scripts/apply-elory-dashboard-quality.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["PROJECT_DIR"])
          checks = {
              "clipboard component": "app/src/main/java/com/pinky/dashboard/ui/components/CopyTextButton.kt",
              "order copy action": "app/src/main/java/com/pinky/dashboard/ui/screens/orders/OrderDetailDialog.kt",
              "product copy action": "app/src/main/java/com/pinky/dashboard/ui/screens/products/ProductsScreen.kt",
              "notification filters": "app/src/main/java/com/pinky/dashboard/ui/screens/notifications/NotificationsScreen.kt",
              "per-table diagnostics": "app/src/main/java/com/pinky/dashboard/ui/screens/health/HealthCheckScreen.kt",
              "shipping overview": "app/src/main/java/com/pinky/dashboard/ui/screens/shipping/ShippingScreen.kt",
          }
          for label, relative in checks.items():
              path = root / relative
              if not path.is_file():
                  raise SystemExit("Missing " + label)
              source = path.read_text(encoding="utf-8")
              marker = {
                  "clipboard component": "fun CopyTextButton",
                  "order copy action": "copy_order_details_btn",
                  "product copy action": "copy_product_",
                  "notification filters": "selectedFilter",
                  "per-table diagnostics": 'updatedResults["section_$tableName"]',
                  "shipping overview": "governorates.size",
              }[label]
              if marker not in source:
                  raise SystemExit("Missing expected implementation: " + label)
              print("PASS:", label)
          PY

      - name: Export patched source archive for review
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$RUNNER_TEMP/Elory-Dashboard-Patched-Source.zip" .

      - name: Upload patched source archive
        uses: actions/upload-artifact@v6
        with:
          name: Elory-Dashboard-Patched-Source
          path: ${{ runner.temp }}/Elory-Dashboard-Patched-Source.zip
          if-no-files-found: error

      - name: Prepare project configuration
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELORY_GOOGLE_SERVICES_JSON: ${{ secrets.ELORY_GOOGLE_SERVICES_JSON }}
          ELORY_DASHBOARD_DEBUG_KEYSTORE_BASE64: ${{ secrets.ELORY_DASHBOARD_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if [[ ! -f .env.example ]]; then
            echo '.env.example is missing from the Android project.'
            exit 1
          fi

          cp .env.example .env

          # Firebase Android client configuration is supplied as a private Actions secret.
          # Without it the project still compiles, but FCM registration stays safely disabled.
          if [[ -n "${ELORY_GOOGLE_SERVICES_JSON:-}" ]]; then
            umask 077
            printf '%s' "$ELORY_GOOGLE_SERVICES_JSON" > app/google-services.json
            python3 - <<'PYFIREBASE'
          import json
          from pathlib import Path

          config = json.loads(Path("app/google-services.json").read_text(encoding="utf-8"))
          project_id = config.get("project_info", {}).get("project_id")
          clients = config.get("client", [])
          matching = [
              client for client in clients
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == "com.pinky.dashboard"
          ]
          if not project_id or not matching:
              raise SystemExit("ELORY_GOOGLE_SERVICES_JSON must be for package com.pinky.dashboard.")
          print("Firebase Android config validated for com.pinky.dashboard.")
          PYFIREBASE
          else
            echo "::warning::ELORY_GOOGLE_SERVICES_JSON is not set. FCM code will compile, but the app cannot obtain a device token yet."
          fi

          python3 - <<'PYENV'
          import os
          from pathlib import Path

          env_file = Path('.env')
          lines = env_file.read_text().splitlines()
          api_key = os.environ.get('GEMINI_API_KEY', '')
          lines = [line for line in lines if not line.startswith('GEMINI_API_KEY=')]
          lines.append('GEMINI_API_KEY="' + api_key + '"')
          env_file.write_text('\n'.join(lines) + '\n')
          PYENV

          # Use one persistent signing key for every debug APK. A fresh CI-generated
          # key breaks Android in-place upgrades because each run gets a new certificate.
          if [[ -z "${ELORY_DASHBOARD_DEBUG_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Missing ELORY_DASHBOARD_DEBUG_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          umask 077
          printf '%s' "$ELORY_DASHBOARD_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          chmod 600 debug.keystore
          keytool -list -keystore debug.keystore -storetype JKS \
            -storepass android -alias androiddebugkey >/dev/null
          echo 'Persistent Elory dashboard signing key loaded and validated.'

      - name: Inspect Gemini BuildConfig configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '--- All project references to Gemini ---'
          grep -R -n -i -C 4 --exclude-dir=.gradle --exclude-dir=build 'GEMINI_API_KEY\|geminiApiKey' "$PROJECT_DIR" || true
          echo '--- Gradle configuration files ---'
          find "$PROJECT_DIR" -maxdepth 3 -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.properties' \) -print
          echo '--- Root Gradle settings ---'
          for file in "$PROJECT_DIR/build.gradle.kts" "$PROJECT_DIR/gradle.properties" "$PROJECT_DIR/app/build.gradle.kts"; do
            if [[ -f "$file" ]]; then echo "--- $file ---"; sed -n '1,260p' "$file"; fi
          done
          echo '--- Environment template ---'
          sed -n '1,100p' "$PROJECT_DIR/.env.example"

      - name: Configure optional Gemini key safely
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PYFIX'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          gradle_file = root / "app/build.gradle.kts"
          source = gradle_file.read_text()

          # The Secrets plugin cannot emit a valid Java String for an absent key.
          # Exclude this property from the plugin and provide an explicit empty String.
          runner_line = '    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"'
          field_line = r'    buildConfigField("String", "GEMINI_API_KEY", "\"\"")'
          if 'buildConfigField("String", "GEMINI_API_KEY"' not in source:
              if runner_line not in source:
                  raise SystemExit("Could not locate defaultConfig insertion point")
              source = source.replace(runner_line, runner_line + "\n" + field_line, 1)

          secrets_line = '  ignoreList.add("FIREBASE_APPCHECK_DEBUG_TOKEN")'
          gemini_ignore = '  ignoreList.add("GEMINI_API_KEY")'
          if gemini_ignore not in source:
              if secrets_line not in source:
                  raise SystemExit("Could not locate Secrets plugin ignoreList")
              source = source.replace(secrets_line, secrets_line + "\n" + gemini_ignore, 1)

          gradle_file.write_text(source)
          for env_file in (root / ".env", root / ".env.example"):
              if env_file.exists():
                  lines = [line for line in env_file.read_text().splitlines()
                           if not line.startswith("GEMINI_API_KEY=")]
                  env_file.write_text("\n".join(lines) + "\n")

          print("Gemini key configured as an optional empty Java String.")
          PYFIX
          echo '--- Applied optional Gemini configuration ---'
          grep -n -C 2 'GEMINI_API_KEY' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Verify previously reported Kotlin fix
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_FILE="$PROJECT_DIR/app/src/main/java/com/pinky/dashboard/ui/screens/health/HealthCheckScreen.kt"
          if [[ ! -f "$SOURCE_FILE" ]]; then
            echo "Expected Kotlin file not found: $SOURCE_FILE"
            exit 1
          fi
          if ! grep -Fq 'rangeUnit = "items"' "$SOURCE_FILE"; then
            echo 'The previously reported getProducts() fix is missing from the source archive.'
            exit 1
          fi
          echo 'Previously reported getProducts() parameters are present.'

      - name: Integrate Cloudflare R2 media uploads
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-r2-media.py
          python3 dashboard-android/scripts/apply-elory-r2-media.py

      - name: Fix product multi-image selection and Android image decoding
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-product-multi-image-picker.py
          python3 dashboard-android/scripts/apply-elory-product-multi-image-picker.py

      - name: Add resilient image loading and fallback to order details
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-order-image-fallback.py
          python3 dashboard-android/scripts/apply-elory-order-image-fallback.py

      - name: Apply permission-aware staff navigation and route guards
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-staff-permission-navigation.py
          PROJECT_DIR="$PROJECT_DIR" python3 dashboard-android/scripts/apply-staff-permission-navigation.py

      - name: Route privileged product reads through the secured Supabase RPC
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile dashboard-android/scripts/apply-elory-secure-product-rpc.py
          PROJECT_DIR="$PROJECT_DIR" python3 dashboard-android/scripts/apply-elory-secure-product-rpc.py

      - name: Configure Kotlin compiler mirror
        shell: bash
        run: |
          set -Eeuo pipefail
          POM_PATH="org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.10/kotlin-compiler-embeddable-2.2.10.pom"
          JAR_PATH="org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.10/kotlin-compiler-embeddable-2.2.10.jar"
          SELECTED_MIRROR=""

          # Test metadata AND the 54 MB compiler JAR. A mirror that serves only one
          # of them is not accepted.
          CANDIDATES=(
            "Google Americas|https://maven-central.storage-download.googleapis.com/maven2"
            "Google Europe|https://maven-central-eu.storage-download.googleapis.com/maven2"
            "Google Asia Pacific|https://maven-central-asia.storage-download.googleapis.com/maven2"
            "Aliyun Central|https://maven.aliyun.com/repository/central"
            "WSO2 Central|https://maven.wso2.org/nexus/content/repositories/central"
          )

          for candidate in "${CANDIDATES[@]}"; do
            LABEL="${candidate%%|*}"
            BASE="${candidate#*|}"
            echo "Preflighting $LABEL ($BASE)"
            rm -f "$RUNNER_TEMP/kotlin-compiler-preflight.pom" "$RUNNER_TEMP/kotlin-compiler-preflight.jar"

            if curl --fail --location --silent --show-error \
                 --retry 1 --retry-all-errors --connect-timeout 15 --max-time 90 \
                 "$BASE/$POM_PATH" --output "$RUNNER_TEMP/kotlin-compiler-preflight.pom" \
               && curl --fail --location --silent --show-error \
                 --retry 2 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 240 \
                 "$BASE/$JAR_PATH" --output "$RUNNER_TEMP/kotlin-compiler-preflight.jar" \
               && [[ -s "$RUNNER_TEMP/kotlin-compiler-preflight.pom" ]] \
               && [[ "$(stat -c %s "$RUNNER_TEMP/kotlin-compiler-preflight.jar")" -gt 1000000 ]]; then
              SELECTED_MIRROR="$BASE"
              echo "Verified both POM and compiler JAR on $LABEL."
              ls -lh "$RUNNER_TEMP/kotlin-compiler-preflight.pom" "$RUNNER_TEMP/kotlin-compiler-preflight.jar"
              break
            fi

            echo "$LABEL did not pass both artifact checks; trying the next mirror."
          done

          if [[ -z "$SELECTED_MIRROR" ]]; then
            echo "No tested Maven mirror could serve both Kotlin compiler files."
            exit 1
          fi

          echo "KOTLIN_COMPILER_MIRROR=$SELECTED_MIRROR" >> "$GITHUB_ENV"
          echo "Selected Kotlin compiler mirror: $SELECTED_MIRROR"

          cat > "$RUNNER_TEMP/kotlin-compiler-mirror.init.gradle" <<'GRADLE'
          def mirrorBase = System.getenv("KOTLIN_COMPILER_MIRROR")
          if (mirrorBase == null || mirrorBase.trim().isEmpty()) {
              throw new GradleException("KOTLIN_COMPILER_MIRROR was not exported by the preflight step.")
          }

          def installKotlinCompilerMirror = { repositoryHandler, label ->
              def existing = repositoryHandler.findByName("EloryKotlinCompilerMirror")
              if (existing != null) {
                  repositoryHandler.remove(existing)
              }

              def mirror = repositoryHandler.maven {
                  name = "EloryKotlinCompilerMirror"
                  url = uri(mirrorBase)
                  content {
                      includeModule("org.jetbrains.kotlin", "kotlin-compiler-embeddable")
                  }
              }

              repositoryHandler.remove(mirror)
              repositoryHandler.addFirst(mirror)
              println("[Elory build] Verified Kotlin compiler mirror installed first in " + label + ": " + mirrorBase)
          }

          def preferSettingsRepositories = false

          gradle.settingsEvaluated { settings ->
              def repositoriesMode = settings.dependencyResolutionManagement.repositoriesMode.get().toString()
              preferSettingsRepositories = repositoriesMode.endsWith("PREFER_SETTINGS") ||
                                           repositoriesMode.endsWith("FAIL_ON_PROJECT_REPOS")

              installKotlinCompilerMirror(
                  settings.dependencyResolutionManagement.repositories,
                  "dependencyResolutionManagement"
              )
              println("[Elory build] dependency repositories mode: " + repositoriesMode)
          }

          gradle.beforeProject { project ->
              if (!preferSettingsRepositories) {
                  installKotlinCompilerMirror(project.repositories, project.path + " project repositories")
              }
              installKotlinCompilerMirror(project.buildscript.repositories, project.path + " buildscript repositories")
          }
          GRADLE
          echo 'Verified Kotlin compiler metadata and JAR; Gradle mirror init script prepared.'

      - name: Run Android unit tests before packaging
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --no-configuration-cache --init-script "$RUNNER_TEMP/kotlin-compiler-mirror.init.gradle" --stacktrace --max-workers=2 \
            -p "$PROJECT_DIR" :app:testDebugUnitTest

      - name: Build Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          # Retry transient repository/network failures (for example HTTP 502/504).
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt/3"
            if gradle --no-daemon --no-configuration-cache --init-script "$RUNNER_TEMP/kotlin-compiler-mirror.init.gradle" --stacktrace --max-workers=2 \
              -p "$PROJECT_DIR" :app:assembleDebug; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Build attempt $attempt failed; waiting before retry..."
              sleep $((attempt * 20))
            fi
          done
          echo "Android build failed after 3 attempts."
          exit 1

      - name: Verify APK
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "APK was not generated: $APK"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apk-output"
          cp "$APK" "$RUNNER_TEMP/apk-output/Elory-Dashboard-debug.apk"
          ls -lh "$RUNNER_TEMP/apk-output/Elory-Dashboard-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Elory-Dashboard-APK
          path: ${{ runner.temp }}/apk-output/Elory-Dashboard-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary Firebase configuration
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${PROJECT_DIR:-}" ]]; then
            rm -f "$PROJECT_DIR/app/google-services.json" "$PROJECT_DIR/.env" "$PROJECT_DIR/debug.keystore"
          fi
