name: Validate Elory storefront JavaScript

on:
  push:
    branches:
      - feature/elory-site-cms-v1
  pull_request:
    branches:
      - main

jobs:
  validate-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.current = None
                  self.capture = False

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return
                  attrs = dict(attrs)
                  script_type = (attrs.get("type") or "").lower()
                  self.capture = (
                      "src" not in attrs
                      and script_type in ("", "text/javascript", "application/javascript", "module")
                  )
                  self.current = [] if self.capture else None

              def handle_data(self, data):
                  if self.capture and self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      if self.capture and self.current is not None:
                          source = "".join(self.current)
                          if source.strip():
                              self.scripts.append(source)
                      self.current = None
                      self.capture = False

          html = Path("index.html").read_text(encoding="utf-8")
          parser = ScriptExtractor()
          parser.feed(html)
          if not parser.scripts:
              raise SystemExit("No inline JavaScript blocks found")
          for index, source in enumerate(parser.scripts, start=1):
              print(f"Checking inline script {index}/{len(parser.scripts)}")
              subprocess.run(
                  ["node", "--check", "--input-type=module"],
                  input=source,
                  text=True,
                  check=True,
              )
          print(f"Validated {len(parser.scripts)} inline JavaScript blocks")
          PY
