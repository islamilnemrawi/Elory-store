name: Validate Elora push Worker source snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/push-worker/**"
      - ".github/workflows/cloudflare-push-worker-source-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check both preserved Worker modules
        run: |
          node --check cloudflare/push-worker/worker.js
          node --check cloudflare/push-worker/worker1.js
