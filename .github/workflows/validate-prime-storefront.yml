name: Validate Elory storefront scripts

on:
  push:
    branches:
      - main
      - elory/prime-config-live-sync
    paths:
      - index.html
      - supabase/migrations/*.sql
      - .github/workflows/validate-prime-storefront.yml
  pull_request:
    paths:
      - index.html
      - .github/workflows/validate-prime-storefront.yml

jobs:
  validate-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax and Prime wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          html = Path("index.html").read_text(encoding="utf-8")
          assert "window.ELORY_PRIME_CONFIG" in html, "Prime config is not published to the storefront"
          assert "getPrimePrice()" in html, "Dynamic Prime price helper is missing"
          assert "getPrimeDiscountPercent()" in html, "Dynamic Prime discount helper is missing"
          assert "ELORY_PRIME_PRICE" not in html, "Hardcoded Prime price constant remains"
          assert "if (c.global && c.global.isStoreOpen === false)" in html, "The existing store availability guard must remain intact"
          cms_start = html.index('if (c.global && c.global.isStoreOpen === false)')
          cms_helpers = html.index('    const $$ =', cms_start)
          assert cms_helpers > cms_start, "The store availability guard must stay at the start of the CMS bootstrap"
          assert "const popupConfig = c.popup || {};" in html, "CMS promotional popup renderer is missing"
          assert "productCards.showPrimePrice" in html, "CMS product-card visual settings are missing"
          assert "footer.customLinks" in html, "CMS footer links renderer is missing"
          assert "g.metaImage" in html and "g.canonicalUrl" in html, "CMS SEO metadata renderer is missing"
          assert "const announcementItems = $$('.announcement-item', announcement || document);" in html, "Announcement ticker must query all nodes before iteration"
          assert "setProperty('background',color(a.backgroundColor),'important')" in html, "CMS announcement color must override the storefront gradient"
          assert "document.querySelectorAll('.hg-icon-v19').forEach(el=>el.style.setProperty('color',color(h.iconsColor),'important'))" in html, "CMS header icon color must override the default icon style"
          assert "paymentMethods?.methods" in html, "Storefront must read dashboard payment method settings"
          assert 'const PRODUCTS_PUBLIC_QUERY = "select=id,name,description,image,category,price,old_price,discount,featured,active,colors,color_options,sizes,variants,created_at,in_stock' in html, "Public product listing must use the safe catalog availability field"
          assert 'eloryFetchRows("catalog_products", publicQuery)' in html, "Storefront product listing must read only from the safe catalog view"
          assert 'eloryFetchRows("catalog_products",params.toString())' in html, "Product details must not request protected product-table columns"
          assert "function productStockAvailability(product,variant=null)" in html, "Customer product details must retain safe stock availability"
          assert "stockAvailability!==false" in html, "Out-of-stock products must remain blocked from adding to cart"
          catalog_privacy = Path("supabase/tests/product_catalog_variant_safety.sql").read_text(encoding="utf-8")
          assert "REVOKE SELECT (variants)" in catalog_privacy, "Raw nested variant JSON must not be publicly readable"
          assert "private.elory_public_product_metadata" in catalog_privacy, "Public catalog must use the narrow safe metadata helper"
          assert "v_hidden_variant_fields" in catalog_privacy, "Staff RPC must filter nested private fields by permission"
          assert "capabilities.cod_enabled!==false" in html, "Storefront must honor the COD availability flag"
          payment_guard = html[html.index('id="elory-payment-capability-guard"'):]
          assert 'if(input.value==="cash_on_delivery") return;' in payment_guard, "Payment recovery guard must not override dashboard COD availability"
          assert 'if(cod && !cod.disabled)' in payment_guard, "Payment recovery guard must not select a COD method disabled by the dashboard"
          assert 'label:"جاري التأكيد",values:[' in html, "COD customer timeline must include a separate confirmation stage"
          assert '...(isCod?[' in html, "Customer timeline must include confirmation only for COD"
          assert 'label:"جاري التحضير",values:["طلب جديد","تم التأكيد","جاري التجهيز","قيد التجهيز","جاري التحضير","NEW","CONFIRMED","PREPARING"]' in html, "COD and online timelines must use the requested جاري التحضير label"
          assert 'تم إلغاء الطلب</div>' in html and 'if(["ملغي","ملغى","CANCELLED","CANCELED"].includes(normalized))' in html, "Cancellation must remain a separate terminal state, outside the progress steps"
          assert 'label:"جاري الشحن",values:["جاري الشحن","SHIPPING"]' in html, "Customer order timeline must include shipping in progress"
          assert 'label:"تم الشحن",values:["تم الشحن","SHIPPED"]' in html, "Customer order timeline must include a separate shipped stage"
          assert 'label:isCod?"تم التسليم":"تم التوصيل",values:["تم التسليم","تم التوصيل","DELIVERED"]' in html, "COD must finish at تم التسليم while online orders finish at تم التوصيل"
          assert 'if(!isCod && ["تم التسليم","DELIVERED"].includes(raw)) return "تم التوصيل"' in html, "Online order status badge must use تم التوصيل"
          assert 'status:selectedPaymentMethod==="cash_on_delivery"?"جاري التأكيد":"جاري الدفع"' in html, "COD orders must start confirmation while online attempts remain pending"
          assert 'get_customer_orders_v2' in html, "Customer order cards must load payment method for payment-aware timelines"
          assert 'function paymentMethodLabel(paymentMethod)' in html, "Customer orders must show readable Cash/Online payment labels"
          assert 'أونلاين - فيزا' in html and 'أونلاين - فودافون كاش' in html and 'كاش - الدفع عند الاستلام' in html, "Payment labels must distinguish online card, Vodafone Cash, and COD"
          assert 'payment_failed' in html and 'فشل الدفع — لم يتم تأكيد استلام المبلغ' in html, "Customers must see explicit failed payment status"
          assert 'openOrdersPage();' in html, "A final Paymob failure must refresh and show the customer's failed order"
          paymob = Path("supabase/functions/paymob/index.ts").read_text(encoding="utf-8")
          assert paymob.count("notification_url: CALLBACK_URL") >= 2, "Card and wallet intentions must both register Paymob transaction callbacks"
          assert "function isOrderPaymentConfirmed(status: unknown)" in paymob, "Paymob callback idempotency guard is missing"
          assert paymob.count("isOrderPaymentConfirmed(order.status)") >= 2, "Callback and redirect verification must not regress a progressed order"
          assert 'order.id,\n      "جاري التحضير",' in paymob, "HMAC-verified callback must enter preparation only after confirmation"
          assert 'updateOrderPaymentStatus(order.id, "جاري التحضير")' in paymob, "Redirect verification must enter preparation only after confirmation"
          order_flow_migration = Path("supabase/migrations/20261118130000_elory_order_status_and_delete_repair.sql").read_text(encoding="utf-8")
          assert "UPDATE public.coupons c" in order_flow_migration and "WHERE c.id IS NOT NULL" in order_flow_migration, "Order deletion coupon reconciliation must satisfy the database safe-update guard"
          assert "'prime'" in order_flow_migration and "v_scope NOT IN" in order_flow_migration, "Owner cleanup must preserve Prime subscriber deletion"
          push_migration = Path("supabase/migrations/20261118131532_elory_cod_insert_push_idempotency.sql").read_text(encoding="utf-8")
          assert "AND TG_OP = 'INSERT'" in push_migration and "'type', TG_OP" in push_migration, "COD new-order push must fire once on insert, not on repeated status edits"
          customer_rpc_migration = Path("supabase/migrations/20261118131000_customer_order_payment_method.sql").read_text(encoding="utf-8")
          assert "get_customer_orders_v2" in customer_rpc_migration and "payment_method text" in customer_rpc_migration, "Customer order RPC must return payment method for COD timeline"
          owner_migration = Path("supabase/migrations/20261118121000_elory_product_delete_and_order_workflow.sql").read_text(encoding="utf-8")
          assert "'products'::text" in owner_migration, "Owner-only cleanup must support products"
          assert "'جاري التحضير'" in owner_migration and "'جاري الشحن'" in owner_migration, "Database must accept the three fulfillment stages"
          staff_reset = Path("supabase/functions/admin-reset-staff-password/index.ts").read_text(encoding="utf-8")
          assert "owner_data_reset_settings" in staff_reset and "callerId !== primaryOwnerId" in staff_reset, "Staff password reset must be restricted to the primary owner"
          assert "/auth/v1/admin/users/" in staff_reset, "Staff password reset must update the Supabase Auth user"
          assert "String(target.role || \"\").toLowerCase() === \"owner\"" in staff_reset, "Staff password reset must not target owner accounts"
          scripts = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script\s*>", html, flags=re.I)
          checked = 0
          for index, (attrs, code) in enumerate(scripts):
              type_match = re.search(r"""type\s*=\s*["']([^"']+)["']""", attrs, flags=re.I)
              script_type = type_match.group(1).lower() if type_match else ""
              if script_type and script_type not in ("text/javascript", "application/javascript", "module"):
                  continue
              if not code.strip():
                  continue
              path = Path(f"/tmp/elory-inline-{index}.mjs")
              path.write_text(code, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
              checked += 1
          if checked == 0:
              raise SystemExit("No inline JavaScript blocks were validated")
          migrations = sorted(Path("supabase/migrations").glob("*_elory_cms_versions_and_rollback.sql"))
          if migrations:
              sql = migrations[0].read_text(encoding="utf-8")
              assert "CREATE TABLE IF NOT EXISTS elory_cms_private.site_customization_versions" in sql
              assert "public.admin_create_site_customization_snapshot" in sql
              assert "public.admin_list_site_customization_versions" in sql
              assert "public.admin_restore_site_customization_version" in sql
              assert "v_current_store_open" in sql and "'{global,isStoreOpen}'" in sql
              assert "SECURITY INVOKER" in sql
              print(f"Validated CMS versioning migration: {migrations[0].name}")
          atomic_restore = Path("supabase/migrations/20261117093000_elory_cms_restore_atomic_draft_clear.sql")
          if atomic_restore.exists():
              atomic_sql = atomic_restore.read_text(encoding="utf-8")
              restore_body = atomic_sql[atomic_sql.index("CREATE OR REPLACE FUNCTION public.admin_restore_site_customization_version"):]
              assert "PERFORM public.admin_clear_site_customization_draft();" in restore_body, "Version restore must clear the draft in the same transaction"
              print(f"Validated atomic CMS restore migration: {atomic_restore.name}")
          print(f"Validated {checked} inline JavaScript blocks.")
          PY
