name: Validate Elory storefront scripts

on:
  push:
    branches:
      - main
      - elory/prime-config-live-sync
    paths:
      - index.html
      - supabase/migrations/*.sql
      - .github/workflows/validate-prime-storefront.yml
  pull_request:
    paths:
      - index.html
      - .github/workflows/validate-prime-storefront.yml

jobs:
  validate-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax and Prime wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          html = Path("index.html").read_text(encoding="utf-8")
          assert "window.ELORY_PRIME_CONFIG" in html, "Prime config is not published to the storefront"
          assert "getPrimePrice()" in html, "Dynamic Prime price helper is missing"
          assert "getPrimeDiscountPercent()" in html, "Dynamic Prime discount helper is missing"
          assert "ELORY_PRIME_PRICE" not in html, "Hardcoded Prime price constant remains"
          assert "if (c.global && c.global.isStoreOpen === false)" in html, "The existing store availability guard must remain intact"
          cms_start = html.index('if (c.global && c.global.isStoreOpen === false)')
          cms_helpers = html.index('    const $$ =', cms_start)
          assert cms_helpers > cms_start, "The store availability guard must stay at the start of the CMS bootstrap"
          assert "const popupConfig = c.popup || {};" in html, "CMS promotional popup renderer is missing"
          assert "productCards.showPrimePrice" in html, "CMS product-card visual settings are missing"
          assert "footer.customLinks" in html, "CMS footer links renderer is missing"
          assert "g.metaImage" in html and "g.canonicalUrl" in html, "CMS SEO metadata renderer is missing"
          assert "const announcementItems = $$('.announcement-item', announcement || document);" in html, "Announcement ticker must query all nodes before iteration"
          scripts = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script\s*>", html, flags=re.I)
          checked = 0
          for index, (attrs, code) in enumerate(scripts):
              type_match = re.search(r"""type\s*=\s*["']([^"']+)["']""", attrs, flags=re.I)
              script_type = type_match.group(1).lower() if type_match else ""
              if script_type and script_type not in ("text/javascript", "application/javascript", "module"):
                  continue
              if not code.strip():
                  continue
              path = Path(f"/tmp/elory-inline-{index}.mjs")
              path.write_text(code, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
              checked += 1
          if checked == 0:
              raise SystemExit("No inline JavaScript blocks were validated")
          migrations = sorted(Path("supabase/migrations").glob("*_elory_cms_versions_and_rollback.sql"))
          if migrations:
              sql = migrations[0].read_text(encoding="utf-8")
              assert "CREATE TABLE IF NOT EXISTS elory_cms_private.site_customization_versions" in sql
              assert "public.admin_create_site_customization_snapshot" in sql
              assert "public.admin_list_site_customization_versions" in sql
              assert "public.admin_restore_site_customization_version" in sql
              assert "v_current_store_open" in sql and "'{global,isStoreOpen}'" in sql
              assert "SECURITY INVOKER" in sql
              print(f"Validated CMS versioning migration: {migrations[0].name}")
          print(f"Validated {checked} inline JavaScript blocks.")
          PY
