name: Elory customer order RPC privacy regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/tests/customer_order_rpc_privacy_*.sql"
      - "supabase/migrations/*customer_order_rpc_privacy.sql"
      - ".github/workflows/customer-order-rpc-privacy.yml"

permissions:
  contents: read

jobs:
  customer-order-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elory_order_privacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elory_order_privacy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated order fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d elory_order_privacy_test -v ON_ERROR_STOP=1 -f supabase/tests/customer_order_rpc_privacy_fixture.sql
      - name: Apply customer order RPC privacy migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d elory_order_privacy_test -v ON_ERROR_STOP=1 -f supabase/tests/customer_order_rpc_privacy_migration.sql
      - name: Verify customer and guest order visibility
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d elory_order_privacy_test -v ON_ERROR_STOP=1 -f supabase/tests/customer_order_rpc_privacy_assertions.sql
