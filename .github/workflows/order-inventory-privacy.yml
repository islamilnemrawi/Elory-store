name: Validate Elory inventory and customer privacy changes

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "supabase/migrations/20261124130000_elory_order_inventory_and_customer_privacy.sql"
      - "supabase/tests/order_inventory_and_customer_privacy.sql"
      - "supabase/tests/order_inventory_fixture.sql"
      - "supabase/functions/admin-create-staff/index.ts"
      - "supabase/functions/admin-reset-staff-password/index.ts"
      - ".github/workflows/order-inventory-privacy.yml"
  pull_request:
    paths:
      - "supabase/migrations/20261124130000_elory_order_inventory_and_customer_privacy.sql"
      - "supabase/tests/order_inventory_and_customer_privacy.sql"
      - "supabase/tests/order_inventory_fixture.sql"
      - "supabase/functions/admin-create-staff/index.ts"
      - "supabase/functions/admin-reset-staff-password/index.ts"
      - ".github/workflows/order-inventory-privacy.yml"

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build disposable Elory schema
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/elory_test" -v ON_ERROR_STOP=1 -f supabase/tests/order_inventory_fixture.sql
      - name: Apply migration to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/elory_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261124130000_elory_order_inventory_and_customer_privacy.sql
      - name: Run inventory lifecycle and privacy integration tests
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/elory_test" -v ON_ERROR_STOP=1 -f supabase/tests/order_inventory_and_customer_privacy.sql

  validate-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration and staff-function safety contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/20261124130000_elory_order_inventory_and_customer_privacy.sql").read_text(encoding="utf-8")
          tests = Path("supabase/tests/order_inventory_and_customer_privacy.sql").read_text(encoding="utf-8")
          fixture = Path("supabase/tests/order_inventory_fixture.sql").read_text(encoding="utf-8")

          required_migration_fragments = [
              "private.elory_order_inventory_state",
              "ALTER TABLE private.elory_order_inventory_state ENABLE ROW LEVEL SECURITY",
              "FOR UPDATE",
              "stock = p.stock - v_item.quantity",
              "stock = p.stock + v_item.quantity",
              "elory_sync_order_inventory_insert",
              "elory_sync_order_inventory_status",
              "elory_restore_order_inventory_before_delete",
              "elory_prevent_active_order_items_change",
              "elory_prevent_product_delete_with_active_orders",
              "CREATE OR REPLACE FUNCTION public.get_customer_orders(",
              "CREATE OR REPLACE FUNCTION public.get_customer_orders_v2(",
              "- 'code'",
              "- 'sku'",
              "- 'stock'",
              "REVOKE ALL ON FUNCTION public.get_customer_orders_v2(text, text) FROM PUBLIC",
          ]
          for fragment in required_migration_fragments:
              assert fragment in migration, f"Migration is missing required safety behavior: {fragment}"

          required_test_fragments = [
              "Pending/failed orders changed stock",
              "Confirmation must deduct exactly once",
              "Cancellation must restore exactly once",
              "Deleting an active order must restore deducted stock",
              "Multi-product failure partially deducted stock",
              "Customer order v2 RPC redaction contract failed",
          ]
          for fragment in required_test_fragments:
              assert fragment in tests, f"Integration test is missing: {fragment}"

          assert "CREATE TABLE public.products" in fixture
          assert "CREATE TABLE public.orders" in fixture
          assert migration.count("CREATE OR REPLACE FUNCTION public.get_customer_orders") == 2
          assert "DROP TRIGGER IF EXISTS zz_elory_validate_order_totals" in migration
          assert "BEFORE INSERT OR UPDATE OF items, coupon_code, governorate, center, prime_requested" in migration
          create_staff = Path("supabase/functions/admin-create-staff/index.ts").read_text(encoding="utf-8")
          reset_staff = Path("supabase/functions/admin-reset-staff-password/index.ts").read_text(encoding="utf-8")

          required_create_staff_fragments = [
              "owner_data_reset_settings?singleton=eq.true",
              'String(actor?.id ?? "") !== primaryOwnerId',
              "/auth/v1/admin/users",
              "email_confirm: true",
              'method: "DELETE"',
          ]
          for fragment in required_create_staff_fragments:
              assert fragment in create_staff, f"Staff creation is missing its security/rollback behavior: {fragment}"

          required_reset_staff_fragments = [
              "staffId === primaryOwnerId",
              "Role is only a display label.",
              "`staff_profiles?id=eq.${encodeURIComponent(staffId)}&select=id&limit=1`",
              "/auth/v1/admin/users/",
          ]
          for fragment in required_reset_staff_fragments:
              assert fragment in reset_staff, f"Staff password reset is missing its primary-owner identity guard or employee lookup: {fragment}"
          assert 'String(target.role || "").toLowerCase() === "owner"' not in reset_staff, "Editable role labels must not be treated as the primary-owner identity."

          print("Elory PostgreSQL integration suite and source safety checks are configured.")
          PY
