name: Apply storefront source fixes

on:
  push:
    branches:
      - feature/elory-site-cms-v1

permissions:
  contents: write

jobs:
  patch-storefront:
    if: "!contains(github.event.head_commit.message, '[skip apply]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe storefront patch
        run: python3 scripts/patch-storefront-runtime.py

      - name: Commit patched storefront source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix storefront CMS selector helpers [skip apply]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Storefront source already contains the fix."
          fi
